plugins {
    id 'java'
    id 'maven-publish'
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
	mavenLocal()
    mavenCentral()
}

version = '0.2.0'

// gradle publish
publishing {

    publications {
        maven(MavenPublication) {
            groupId = 'io.utility'
            artifactId = 'letter'
            version = project.version
            
            artifact 'build/libs/letter_utility-' + project.version + '.jar'
        }
    }

    repositories {
        maven {
            credentials {
                username = "admin"
                password = "password"
            }
            url = "http://localhost:8081/artifactory/libs-release-local"
            allowInsecureProtocol = true
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': 'Letter-Utility', 'Implementation-Version': project.version)
    }
}

ext {
	logbackVersion = '1.3.6'
	slf4jVersion = '2.0.7'
}

dependencies {
	implementation 'org.slf4j:slf4j-api:' + slf4jVersion
	runtimeOnly 'org.slf4j:jcl-over-slf4j:' + slf4jVersion
	implementation 'ch.qos.logback:logback-classic:' + logbackVersion

	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	implementation 'io.jsonwebtoken:jjwt-gson:0.12.7'

	implementation 'org.apache.commons:commons-lang3:3.20.0'
	implementation "org.freemarker:freemarker:2.3.34"
	testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
